name: Agent Browser Jev

on:
  pull_request:
    paths: ['skills/agent-browser-jev/**', '.github/workflows/agent-browser-jev.yml', 'CHANGELOG.md']
  push:
    branches: [main]
    paths: ['skills/agent-browser-jev/**', '.github/workflows/agent-browser-jev.yml', 'CHANGELOG.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.3.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: skills/agent-browser-jev
      - run: npm test
        working-directory: skills/agent-browser-jev
      - run: python3 .agents/scripts/validate_release_contract.py --base-ref "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
